# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.1.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

  lint-typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - run: pnpm turbo lint typecheck

  test-unit:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - run: pnpm turbo test:unit

  test-integration:
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: confhub_test, POSTGRES_USER: confhub, POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping"
    env:
      DATABASE_URL: postgresql://confhub:test@localhost:5432/confhub_test
      REDIS_URL: redis://localhost:6379
    steps:
      # - run: pnpm --filter=@confhub/db db:migrate
      - run: pnpm turbo test:integration

  audit:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - run: pnpm audit --audit-level critical

  openapi-validate:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      # Only run if openapi spec exists
      - run: |
          if [ -f specs/docs/openapi/openapi.yaml ]; then
            npx @redocly/cli lint specs/docs/openapi/openapi.yaml
          else
            echo "OpenAPI spec not found, skipping."
          fi
